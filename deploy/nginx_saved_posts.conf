# Drop this into the existing server block for your domain
# (e.g. timkovi.ch) — not a standalone server block, since the app is
# mounted under a path prefix rather than its own subdomain.
#
# The app itself serves all routes under /saved_posts (see the Blueprint
# in app.py), so nginx just needs to forward the request as-is — no path
# stripping or forwarded-prefix header required.

location /saved_posts {
    proxy_pass http://unix:/run/saved_posts/saved_posts.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
